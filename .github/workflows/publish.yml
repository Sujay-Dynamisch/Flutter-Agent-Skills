# Publishes to pub.dev when a version tag is pushed, e.g.:
#   git tag v0.1.1 && git push origin v0.1.1
# Requires automated publishing to be enabled on pub.dev (package Admin tab)
# for this repository with tag pattern: v{{version}}
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for pub.dev authentication via OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
